<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон: Черный квадрат с закругленными углами -->
  <rect x="40" y="40" width="432" height="432" rx="100" fill="black"/>
  
  <!-- Инструменты (толстые контуры) -->
  <g transform="translate(256, 260)">
    <!-- ОТВЁРТКА ( \ ) -->
    <g transform="rotate(-45) scale(1.1)">
      <!-- Ручка -->
      <path d="M-25,-110 a25,25 0 0,1 50,0 L20,-40 a20,20 0 0,1 -40,0 Z" fill="none" stroke="white" stroke-width="18" stroke-linejoin="round"/>
      <!-- Стержень -->
      <path d="M-7,-40 L-7,80 L7,80 L7,-40" fill="none" stroke="white" stroke-width="18" stroke-linecap="round"/>
      <!-- Наконечник -->
      <path d="M-12,85 L12,85 L12,100 L-12,100 Z" fill="white"/>
    </g>

    <!-- ГАЕЧНЫЙ КЛЮЧ ( / ) -->
    <g transform="rotate(45) scale(1.1)">
      <!-- Головка -->
      <path d="M-45,-90 a45,45 0 1,1 90,0 L25,-65 a25,25 0 1,0 -50,0 Z" fill="none" stroke="white" stroke-width="18" stroke-linejoin="round"/>
      <!-- Рукоятка -->
      <path d="M-12,-60 L-12,65 L12,65 L12,-60" fill="none" stroke="white" stroke-width="18"/>
      <!-- Кольцо -->
      <circle cx="0" cy="90" r="35" fill="none" stroke="white" stroke-width="18"/>
    </g>
  </g>
  
  <!-- Кружок с галочкой (Badge) -->
  <g transform="translate(415, 97)">
    <circle cx="0" cy="0" r="65" fill="white"/>
    <path d="M-35,0 L-10,25 L35,-30" stroke="black" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

