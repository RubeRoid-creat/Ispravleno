<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон: Глубокий черный (как в хедере сайта) -->
  <rect width="512" height="512" rx="110" fill="#000000"/>
  
  <!-- Гаечный ключ (Белый, как на сайте) -->
  <g transform="translate(256, 256) rotate(-45)">
    <rect x="-100" y="-25" width="200" height="50" rx="10" fill="white"/>
    <circle cx="-100" cy="0" r="55" fill="white"/>
    <circle cx="100" cy="0" r="55" fill="white"/>
    <!-- Вырезы ключа (черные, создают прозрачность) -->
    <rect x="-160" y="-20" width="80" height="40" fill="#000000"/>
    <rect x="80" y="-20" width="80" height="40" fill="#000000"/>
  </g>
  
  <!-- Кружок с галочкой в углу (Стиль "Исправлено") -->
  <circle cx="415" cy="97" r="60" fill="white"/>
  <path d="M380 100 L410 130 L460 70" stroke="#000000" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
