<svg width="600" height="120" viewBox="0 0 600 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Иконка слева: компактная версия -->
  <g transform="scale(0.19) translate(20, 5)">
    <!-- Фон: Глубокий черный с закругленными углами -->
    <rect width="512" height="512" rx="110" fill="#000000"/>
    
    <!-- Гаечный ключ (Белый) -->
    <g transform="translate(256, 256) rotate(-45)">
      <rect x="-100" y="-25" width="200" height="50" rx="10" fill="white"/>
      <circle cx="-100" cy="0" r="55" fill="white"/>
      <circle cx="100" cy="0" r="55" fill="white"/>
      <!-- Вырезы ключа -->
      <rect x="-160" y="-20" width="80" height="40" fill="#000000"/>
      <rect x="80" y="-20" width="80" height="40" fill="#000000"/>
    </g>
    
    <!-- Кружок с галочкой -->
    <circle cx="415" cy="97" r="60" fill="white"/>
    <path d="M380 100 L410 130 L460 70" stroke="#000000" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Текст "Исправлено" -->
  <text x="130" y="60" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="bold" fill="#000000">Исправлено</text>
  
  <!-- Текст "СЕРВИС РЕМОНТА" -->
  <text x="130" y="85" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#666666" letter-spacing="1.5">СЕРВИС РЕМОНТА</text>
</svg>

